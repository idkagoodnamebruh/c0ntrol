name: Phase 11 Windows Regression

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain versions
        shell: pwsh
        run: cmake --version

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build-windows
          -DBUILD_APP=OFF
          -DBUILD_TESTING=ON
          -DENABLE_MEDIAPIPE=OFF
          -DENABLE_NATIVE_INPUT_SMOKE=ON

      - name: Build
        shell: pwsh
        run: cmake --build build-windows --config Release --parallel

      - name: Test
        shell: pwsh
        run: >-
          ctest --test-dir build-windows
          -C Release
          --output-on-failure

      - name: Repeat critical async lifecycle tests
        shell: pwsh
        run: >-
          ctest --test-dir build-windows
          -C Release
          -R "test_(native_input_lifecycle|async_input_runtime)"
          --repeat until-fail:50
          --output-on-failure
