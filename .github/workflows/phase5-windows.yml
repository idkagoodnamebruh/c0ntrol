name: Phase 5 Windows Build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain versions
        shell: pwsh
        run: cmake --version

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build-windows
          -DBUILD_APP=OFF
          -DBUILD_TESTING=ON
          -DENABLE_MEDIAPIPE=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build-windows --config Release --parallel

      - name: Test
        shell: pwsh
        run: >-
          ctest --test-dir build-windows
          -C Release
          --output-on-failure
